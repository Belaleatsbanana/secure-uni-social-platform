# Development override - extends docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      # MongoDB Atlas connection string (required in .env)
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required - set your MongoDB Atlas connection string in .env}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    # Disable healthcheck in dev (faster restarts)
    healthcheck:
      disable: true

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    environment:
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    # Disable healthcheck in dev (faster restarts)
    healthcheck:
      disable: true
