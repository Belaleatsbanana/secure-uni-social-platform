# Production-ready Docker Compose configuration for UniSocial Platform
# This configuration sets up the server and client services with health checks, environment variables, and a shared network.
services:
  # SERVER (Backend API)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: uni-social-server
    restart: unless-stopped # Restart the server container unless it is explicitly stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # MongoDB Atlas connection string (required in .env)
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required - set your MongoDB Atlas connection string in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost,https://susi-iocpt.ondigitalocean.app,https://lionfish-app-hgryb.ondigitalocean.app}
    ports:
      - "3001:3001"
    volumes:
      - ./server/public/assets:/app/public/assets # Persist uploaded assets
    networks:
      - app-network # Connect server to the shared network
    healthcheck:
      # CMD checks if the server is responding to HTTP requests
      # Using wget to check the /health endpoint, which should return a 200 status if the server is healthy
      # The --spider option makes wget check the URL without downloading the content, and -q suppresses output
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s     # Check every 30 seconds
      timeout: 10s      # Wait up to 10 seconds for a response
      retries: 5        # If the server fails to respond successfully 5 times in a row, it will be marked as unhealthy
      start_period: 30s # Allow 30 seconds for the server to start before health checks begin

  # CLIENT (React Frontend)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:3001}
    container_name: uni-social-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network # Connect client to the shared network
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# NETWORKS 
networks:
  app-network:
    driver: bridge # Use the default bridge network driver for communication between services
