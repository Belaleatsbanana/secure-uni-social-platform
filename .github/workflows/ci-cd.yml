name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '20.x'

jobs:
  # ==================== SECURITY SCANNING ====================
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Run npm audit (Server)
        working-directory: ./server
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high --omit=dev || true
        continue-on-error: true

      - name: Run npm audit (Client)
        working-directory: ./client
        run: |
          npm ci
          npm audit --audit-level=high --omit=dev || true
        continue-on-error: true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ==================== SERVER TESTS ====================
  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: security-scan
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci --legacy-peer-deps

      - name: Run linter
        working-directory: ./server
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ./server
        run: npm test --if-present
        env:
          NODE_ENV: test
          MONGO_URL: mongodb://localhost:27017/test_db
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
          PORT: 3001

  # ==================== CLIENT TESTS ====================
  client-test:
    name: Client Tests
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run linter
        working-directory: ./client
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ./client
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:3001

      - name: Build application
        working-directory: ./client
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:3001

  # ==================== DOCKER BUILD & SECURITY ====================
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [server-test, client-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          load: true
          tags: secure-uni-social-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          load: true
          tags: secure-uni-social-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (Server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-uni-social-server:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (Client)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-uni-social-client:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

