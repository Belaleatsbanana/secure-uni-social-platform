name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '20.x'

jobs:
  # SECURITY SCANNING
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code # Checkout the repository code to the runner
        uses: actions/checkout@v4

      - name: Setup Node.js # Set up the Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (Server) # Run npm audit for the server to check for vulnerabilities
        working-directory: ./server
        run: |
          npm install --legacy-peer-deps
          npm audit --audit-level=high --omit=dev || true
        continue-on-error: true

      - name: Run npm audit (Client) # Run npm audit for the client to check for vulnerabilities
        working-directory: ./client
        run: |
          npm install --legacy-peer-deps
          npm audit --audit-level=high --omit=dev || true
        continue-on-error: true

        # Use TruffleHog to scan the codebase for any hardcoded secrets or sensitive information
      - name: Check for secrets in code 
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

  # SERVER TESTS
  server-test:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: security-scan
    
    # Use a MongoDB service for testing the server API 
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        # cmd ping to ensure MongoDB is healthy before running tests
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./server
        run: npm install --legacy-peer-deps

      - name: Run linter
        working-directory: ./server
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ./server
        run: npm test --if-present
        env:
          NODE_ENV: test
          MONGO_URL: mongodb://localhost:27017/test_db
          # Use a test secret key for JWT during CI pipeline to ensure tests can run without requiring real secrets
          JWT_SECRET: test-secret-key-for-ci-pipeline-only
          PORT: 3001

  # CLIENT TESTS
  client-test:
    name: Client Tests
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./client
        run: npm install --legacy-peer-deps

      # Lint the client codebase to ensure code quality and catch potential issues before running tests
      - name: Run linter
        working-directory: ./client
        run: npm run lint --if-present

      # Run client tests in CI mode to ensure all tests pass without requiring user interaction.
      - name: Run tests
        working-directory: ./client
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:3001

        # Build the client application to ensure it can be built successfully in a production-like environment.
        # to catch any build-time issues that might arise due to code changes or dependency updates.
      - name: Build application
        working-directory: ./client
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:3001

  # DOCKER BUILD & SECURITY
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [server-test, client-test]
    # Only run this job on pushes to master/main to avoid unnecessary builds
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          load: true
          # Tag the image with a unique name that includes the commit SHA 
          # to avoid conflicts and ensure we are scanning the correct image
          tags: secure-uni-social-server:${{ github.sha }} 
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          load: true
          tags: secure-uni-social-client:${{ github.sha }}
          cache-from: type=gha # Use GitHub Actions cache to speed up 
          cache-to: type=gha,mode=max # Cache the build layers to speed up future builds

      # Run Trivy vulnerability scanner on the built server image to check for any critical 
      # or high severity vulnerabilities in the base image or application dependencies.
      - name: Run Trivy vulnerability scanner (Server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-uni-social-server:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (Client)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-uni-social-client:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

