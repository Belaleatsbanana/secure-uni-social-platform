name: Security Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Run security scan every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  # DEPENDENCY SCANNING
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm install --legacy-peer-deps

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm install --legacy-peer-deps

      # snyk is a tool for scanning Node.js projects for known vulnerabilities in dependencies.
      - name: Run Snyk to check for vulnerabilities (Server)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=server/package.json

      - name: Run Snyk to check for vulnerabilities (Client)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=client/package.json

  # LICENSE COMPLIANCE
  # This job checks the licenses of all dependencies used in the server and client to ensure they comply with the project's licensing requirements.
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check Server Licenses
        working-directory: ./server
        run: |
          npm install --legacy-peer-deps
          license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;Unlicense;0BSD;CC-BY-4.0;Python-2.0;BlueOak-1.0.0' --excludePrivatePackages || true
        continue-on-error: true

      - name: Check Client Licenses
        working-directory: ./client
        run: |
          npm install --legacy-peer-deps
          license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;Unlicense;0BSD;CC-BY-4.0;Python-2.0;BlueOak-1.0.0' --excludePrivatePackages || true
        continue-on-error: true

  # SECRET SCANNING
  # This job uses TruffleHog and GitLeaks to scan the codebase 
  # for any hardcoded secrets or sensitive information that may have been accidentally committed.
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --only-verified

      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST (Static Application Security Testing)
  # This job uses CodeQL to perform static code analysis on the server and client codebases
  # to identify potential security vulnerabilities, code quality issues
  # , and other bugs that could lead to security risks.
  sast-scan:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # DOCKER IMAGE SCANNING
  # This job builds Docker images for both the server and client, 
  # then uses Trivy to scan the images for vulnerabilities in the base image and application dependencies.
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          load: true
          tags: server-scan:latest

      - name: Build Client Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          load: true
          tags: client-scan:latest

      - name: Run Trivy vulnerability scanner (Server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'server-scan:latest'
          format: 'sarif'
          output: 'trivy-server-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Trivy vulnerability scanner (Client)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'client-scan:latest'
          format: 'sarif'
          output: 'trivy-client-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-server-results.sarif'
